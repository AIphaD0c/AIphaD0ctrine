<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="{{ '/favicon.ico?v=4' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/favicon.png?v=4' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/favicon.png?v=4' | relative_url }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.description %}
  {% assign canonical_url = page.url | absolute_url %}

  <title>{{ page_title }}</title>

  <meta name="description" content="{{ page_description | escape }}">
  <link rel="canonical" href="{{ canonical_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page_title | escape }}">
  <meta name="twitter:description" content="{{ page_description | escape }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
